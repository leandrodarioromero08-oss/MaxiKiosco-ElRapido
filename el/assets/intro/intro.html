 const f=(t-T0)/DT,i=Math.min(NSTEP-2,f|0),u=f-i;o[0]=TXs[i]+(TXs[i+1]-TXs[i])*u;o[1]=TYs[i]+(TYs[i+1]-TYs[i])*u;return o}

 g.fillStyle='#FFD600';g.strokeStyle='#3a0508';g.lineWidth=5;for(const p of FLM){g.fill(p);g.stroke(p)}

 g.fillStyle='#E0151C';g.strokeStyle='#3a0508';g.lineWidth=5;for(const p of KN){g.fill(p);g.stroke(p)}

 g.fillStyle='#fff3b0';g.fill(F2);g.fillStyle='#FFC800';g.fill(F3);g.fillStyle='#fff';g.fill(F4)}

 g.fillStyle=g.strokeStyle='#FFD600';g.lineWidth=5;for(const p of FLM){g.fill(p);g.stroke(p)}
 g.fillStyle=g.strokeStyle='#d9131b';g.save();g.translate(8,9);g.lineWidth=6;g.fill(BODY);g.stroke(BODY);g.restore();
 g.lineWidth=19;g.stroke(ROPE);g.lineWidth=5;for(const p of KN){g.fill(p);g.stroke(p)}g.lineWidth=6;g.fill(BODY);g.stroke(BODY);
 g.fillStyle=g.strokeStyle='#FFC800';g.lineWidth=5;g.fill(F1);g.stroke(F1)}

function place(x,y,r,s,vx,vy,px,py){const sa=Math.atan2(vy,vx),k=1+Math.min(.45,Math.hypot(vx,vy)/9000);

const NT=64,TD=.011,OFF=[[42,-52,16],[-20,100,10],[-132,-14,9]],TC=['#FFD25A','#fff3c8','#FF9d2e'],

const STK=TC.map(col=>{const c=document.createElement('canvas');c.width=8;c.height=128;const g=c.getContext('2d'),im=g.createImageData(8,128),r=parseInt(col.slice(1,3),16),gg=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);

function render(t){

 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);

 let S=.85*(.92+.08*eo((t-.8)/2.6))*(1-.15*ant);const w=ez(zu*2.5),pX=190+42*w,pY=200-52*w;if(t>=ZT){S=.72*Math.pow(70,Z);x=CX;y=CY}

  for(let b=0;b<3;b++){ctx.beginPath();for(let i=b;i<NL;i+=3){const e=SL[i],u=((e[1]-D*e[2])%2600+2600)%2600-1300;ctx.moveTo(u,e[0]);ctx.lineTo(u+40+sp*e[2]*.05,e[0])}
   ctx.strokeStyle=b==1?'#fff2c4':'#ffcf5c';ctx.globalAlpha=sf*[.35,.5,.65][b];ctx.lineWidth=[1.3,2.2,3.4][b];ctx.stroke()}

  for(let j=0;j<NP;j++){const R=110,m=Math.floor((t*R-j)/NP),tb=(j+NP*m)/R,age=t-tb,life=.5+.3*hs(j,m);

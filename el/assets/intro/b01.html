function render(t){

 p1.style.webkitMaskImage=p1.style.maskImage=`radial-gradient(ellipse ${rx}px ${ry}px at 880px 560px,#000 18%,transparent 100%)`;
 // --- vibración real del teléfono (capa independiente) y luz sobre su carcasa
 ph.style.transform=`translate(${tr*2.4}px,${tr*1.2}px) rotate(${tr*.14}deg)`;pg.style.opacity=cl(g*1.3);pg.style.filter=`brightness(${1+1.8*g}) saturate(1.3)`;
 // --- pantalla
 sc.style.opacity=ez((t-1.35)/.25);
 const wake=.55+.45*ez((t-1.4)/.4);lock.style.filter=`brightness(${wake})`;
 $('clk').style.opacity=1-ez((t-7.2)/.7);document.querySelectorAll('.bt,#hb').forEach(e=>e.style.opacity=1-ez((t-7.2)/.6));
 cards.forEach((c,i)=>{const u=eo((t-T[i])/.5);let s=0;for(let j=i+1;j<T.length;j++)s+=ez((t-T[j])/.45);
  const y=172+s*86,k=ez((t-7.2-i*.03)/.7);let op=u*cl(1-(s-4.2)/1.1)*(1-k*k);
  c.e.style.opacity=op;c.e.style.transform=`translateY(${y-60*(1-u)+(345-(y+37))*k}px) scale(${(.92+.08*u)*(1-.88*k)})`;c.e.style.filter=u<1?`blur(${(1-u)*4}px)`:'none';
  const l=s<.5?'ahora':'hace '+Math.round(s)+' min';if(l!==c.t){c.l.textContent=l;c.t=l}});
 app.style.clipPath=`circle(${eo((t-7.7)/1)*1100}px at 195px 345px)`;
 const ig=ez((t-9.9)/1.6),sp=ebk((t-7.7)/.8),br=1+.025*Math.sin(t*5)*ig;
 ic.style.transform=`scale(${(.15+.85*sp)*(1+.06*ig)*br})`;
 ic.style.filter=`drop-shadow(0 0 ${8+46*ig}px rgba(255,190,50,${.35+.65*ig})) brightness(${1+.45*ig})`;
 $('aw').style.filter=`brightness(${1+.9*ig})`;
 $('ttl').style.opacity=ez((t-8.3)/.6);$('ttl').style.textShadow=`0 0 ${30*ig}px rgba(255,200,80,${ig})`;
 const sp2=$('spn');sp2.style.opacity=ez((t-8.6)/.3)*(1-ez((t-9.4)/.3));sp2.style.transform=`rotate(${t*420}deg)`;
 const ry2=$('rays');ry2.style.opacity=ig*.7;ry2.style.transform=`rotate(${t*14}deg)`;
 const sw=$('sw'),su=cl((t-10.3)/1.1);sw.style.opacity=su>0&&su<1?1:0;sw.style.left=(-150+700*ez(su))+'px';
 // --- FX: rayos sobre el plano del mostrador, destellos, partículas, polvo en suspensión

 for(let i=0;i<30;i++){const a=hs(i,1)*6.283+t*.03,L=(120+(600+hs(i,2)*500)*I)*(.5+hs(i,3)),w=.012+hs(i,4)*.03,f=.6+.4*Math.sin(t*3+i);
  if(I<.02)break;fx.save();fx.translate(CX,CY);fx.scale(1,.55);fx.rotate(a);const gr=fx.createLinearGradient(0,0,L,0);gr.addColorStop(0,`rgba(255,226,150,${.45*Math.min(I,1)*f})`);gr.addColorStop(1,'rgba(255,170,40,0)');fx.fillStyle=gr;fx.beginPath();fx.moveTo(0,0);fx.lineTo(L,-L*w);fx.lineTo(L,L*w);fx.fill();fx.restore()}
 if(I>0){const r=120+420*I,gg=fx.createRadialGradient(CX,CY,0,CX,CY,r);gg.addColorStop(0,`rgba(255,235,180,${.5*Math.min(I,1.2)})`);gg.addColorStop(1,'rgba(255,140,20,0)');fx.fillStyle=gg;fx.fillRect(0,0,1672,941)}
 for(let i=0;i<70;i++){const b=9.9+hs(i,5)*2.3,u=t-b;if(u<0||u>1.9)continue;const a=-1.57+(hs(i,6)-.5)*2.6,v=60+hs(i,7)*170,x=CX+(hs(i,8)-.5)*320+Math.cos(a)*v*u,y=CY+(hs(i,9)-.5)*120+Math.sin(a)*v*u-30*u*u,al=Math.sin(Math.PI*u/1.9)*.9,s=1+hs(i,10)*2.4;
  fx.fillStyle=`rgba(255,${190+hs(i,11)*50|0},90,${al})`;fx.beginPath();fx.arc(x,y,s,0,6.283);fx.fill();fx.strokeStyle=`rgba(255,200,90,${al*.4})`;fx.lineWidth=s*.6;fx.beginPath();fx.moveTo(x,y);fx.lineTo(x-Math.cos(a)*v*.05,y-Math.sin(a)*v*.05);fx.stroke()}
 for(let i=0;i<34;i++){const x=(hs(i,12)*1900+t*(4+hs(i,13)*8))%1800-60,y=60+hs(i,14)*760-t*(3+hs(i,15)*5)%800,r=2+hs(i,16)*4,al=.05+.07*Math.sin(t*.8+i)*Math.sin(t*.8+i);fx.fillStyle=`rgba(255,170,80,${al})`;fx.beginPath();fx.arc(x,(y+800)%900+20,r,0,6.283);fx.fill()}
 // --- destello dorado-blanco y cierre iris a negro absoluto
 const fl=$('fl'),ir=$('ir'),R=Math.pow(cl((t-11.2)/1.1),1.5)*175,dim=1-ez((t-13.2)/.5);
 fl.style.opacity=t>=11.2&&t<13.8?dim:0;
 fl.style.background=`radial-gradient(circle at ${CX/16.72}% ${CY/9.41}%,#fffaf0 0,#fff2cf ${R*.35}%,#ffd25a ${R*.75}%,rgba(255,150,30,0) ${R}%)`;
 const iR=t<12.6?200:200*(1-ez((t-12.6)/1.1));ir.style.opacity=t>=12.6?1:0;
 ir.style.background=`radial-gradient(circle at ${CX/16.72}% ${CY/9.41}%,transparent ${Math.max(0,iR-3)}px,#000 ${iR}px)`.replace(/px/g,'px');

// ===== SONIDO (WebAudio sintetizado, sin archivos externos) =====
let ac,mu,mst,rv,nb,snd=true;
function aInit(){try{ac&&ac.close()}catch(e){}ac=new AudioContext();const cp=ac.createDynamicsCompressor();mst=ac.createGain();mu=ac.createGain();mu.gain.value=snd?1:0;mst.connect(cp);cp.connect(mu);mu.connect(ac.destination);
 nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);let d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const n=ac.sampleRate*2.4,ib=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
 rv=ac.createConvolver();rv.buffer=ib;const rg=ac.createGain();rg.gain.value=.5;rv.connect(rg);rg.connect(mst)}
const G=v=>{const g=ac.createGain();g.gain.value=v||0;return g};
function N(t,dur,type,f0,f1,q,pk,a,to){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=G();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+dur*a);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(f);f.connect(g);g.connect(to||mst);s.start(t);s.stop(t+dur+.05)}
function O(t,dur,type,f0,f1,pk,to,at){const o=ac.createOscillator(),g=G();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+(at||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(to||mst);o.start(t);o.stop(t+dur+.05)}
const bell=(t,f,p)=>[1,2.76,5.4].forEach((k,i)=>{O(t,1.7/(i+1),'sine',f*k,0,p/(i*1.8+1));O(t,1.7/(i+1),'sine',f*k,0,p/(i*3+2),rv)});
function buzz(t,p){const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;lp.connect(mst);[0,.18].forEach(o=>{O(t+o,.12,'sawtooth',78,0,p,lp);O(t+o,.14,'sine',55,0,p*.8);N(t+o,.05,'bandpass',900,900,2,p*.45,.1)})}
function aPlay(){aInit();ac.resume&&ac.resume();const t0=ac.currentTime+.12,F=[1318.5,1318.5,1480,1568,1760,1976,2093,2349,2637];
 const rs=ac.createBufferSource();rs.buffer=nb;rs.loop=true;const lf=ac.createBiquadFilter();lf.type='lowpass';lf.frequency.value=150;const rg=G();rg.gain.setValueAtTime(0,t0);rg.gain.linearRampToValueAtTime(.09,t0+1.5);rg.gain.setValueAtTime(.09,t0+12.2);rg.gain.linearRampToValueAtTime(0,t0+13.6);rs.connect(lf);lf.connect(rg);rg.connect(mst);rs.start(t0);rs.stop(t0+14);
 T.forEach((b,i)=>{buzz(t0+b-.02,.14+.02*i);bell(t0+b,F[i],.1+.015*i)});
 N(t0+7.2,.8,'bandpass',300,4500,1.2,.28,.8);O(t0+7.7,.5,'sine',120,45,.5);O(t0+7.75,.25,'sine',880,1760,.12,rv);
 [8.6,8.8,9,9.2].forEach(x=>N(t0+x,.04,'bandpass',2200,2200,3,.05,.1));
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(300,t0+8.4);lp.frequency.exponentialRampToValueAtTime(5000,t0+12.3);const pg2=G();pg2.gain.setValueAtTime(0,t0+8.4);pg2.gain.linearRampToValueAtTime(.09,t0+11.8);pg2.gain.linearRampToValueAtTime(0,t0+12.4);lp.connect(pg2);pg2.connect(mst);pg2.connect(rv);
 [110,110.8].forEach(f=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t0+8.4);o.frequency.exponentialRampToValueAtTime(f*2,t0+12.3);o.connect(lp);o.start(t0+8.4);o.stop(t0+12.5)});

 for(let k=0;k<22;k++)O(t0+9.9+Math.pow(k/22,1.2)*2.2,.35,'sine',2400+Math.random()*3600,0,.035,rv);
 N(t0+11.2,1.2,'highpass',800,6000,.7,.35,.9);
 O(t0+12.35,1.8,'sine',95,34,.9);N(t0+12.35,1,'lowpass',2500,90,.7,.6,.02);[1318.5,1975.5,2637].forEach(f=>bell(t0+12.4,f,.1));
 N(t0+12.6,1.1,'bandpass',5000,90,1,.25,.05);O(t0+12.6,1.1,'sine',500,40,.3);
 mst.gain.setValueAtTime(1,t0+13.3);mst.gain.linearRampToValueAtTime(0,t0+13.75)}
let t0=null,raf,done=false;
function loop(ts){if(t0===null)t0=ts;const t=Math.min(Math.max((ts-t0)/1000,0),DUR);render(t);if(t>=DUR){if(!done){done=true;const ev=new CustomEvent('elrapido:bloque01:fin',{detail:{siguiente:'fachada'}});dispatchEvent(ev);try{parent.postMessage({elrapido:'bloque01:fin'},'*')}catch(e){}}return}raf=requestAnimationFrame(loop)}

const q=new URLSearchParams(location.search);
window.ElRapidoBloque01={play,mute:v=>{snd=!v;mu&&(mu.gain.value=snd?1:0)},seek:t=>{cancelAnimationFrame(raf);render(t)},DUR};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play();if((e.key==='m'||e.key==='M')&&mu){snd=!snd;mu.gain.value=snd?1:0}});
render(0);
})();
